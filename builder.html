<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
        El HTML del Creador V4 es un contenedor vacío.
        Cero HTML estático. Cero CSS estático.
        La interfaz del Creador también es un Árbol de Definición JSON.
    -->
</head>
<body style="margin: 0; padding: 0; box-sizing: border-box; background: #1e1e1e;">
    <div id="builder-app"></div>
    <script src="v4.js"></script>
    <script>
        // Inicialización del Motor apuntando al Árbol de Definición del Builder
        const engine = new V4Engine('builder-app');
        engine.init('builder-tree.json');
    </script>
</body>
</html>
